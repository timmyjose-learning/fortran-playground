name = "vectors_lab"
version = "0.1.0"
license = "license"
author = "Timmy Jose"
maintainer = "zoltan.jose@gmail.com"
copyright = "Copyright 2026, Timmy Jose"

[features]
debug.gfortran.flags = "-g -O0 -fcoarray=single -fbounds-check -fsanitize=address,undefined -fno-omit-frame-pointer -std=f2023 -Wall -Wextra -Wtrampolines -pedantic -march=native"
release.gfortran.flags= "-O2 -fcoarray=single -fbounds-check -std=f2023 -Wall -Wextra -Wtrampolines -pedantic -march=native"

[profiles]
debug = ["debug"]
release = ["release"]

