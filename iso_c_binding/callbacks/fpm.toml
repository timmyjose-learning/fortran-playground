name = "callbacks"
version = "0.1.0"
license = "license"
author = "Timmy Jose"
maintainer = "zoltan.jose@gmail.com"
copyright = "Copyright 2026, Timmy Jose"


[features]
debug_mode.gfortran.flags = "-g -O0 -fcheck=all -fsanitize=address,undefined -std=f2023 -Wall -Wextra -pedantic -march=native"
release_mode.gfortranflags = "-O2 -fcheck=all -std=f2023 -Wall -Wextra -pedantic -march=native"

[profiles]

debug = ["debug_mode"]
release = ["release_mode"]
